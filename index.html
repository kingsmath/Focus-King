<title id="seoTitleTag">포커스킹 FOCUS KING</title>
<meta name="description" id="seoDescTag" content="여러 명이 동시에 즐기는 스포트라이트 정답 맞히기 게임, 포커스킹!">
<meta name="keywords" id="seoKeywordsTag" content="포커스킹,전자칠판 게임,스포트라이트 게임,교육용 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg-deep:#12143a;
    --bg-panel:#1a1d54;
    --bg-panel-2:#212463;
    --gold:#f4c94c;
    --gold-soft:#f9dd8a;
    --teamA:#ff6b5c;
    --teamA-dim:#5a2521;
    --teamB:#3fc1e9;
    --teamB-dim:#1c4a58;
    --ink:#f5f3ff;
    --ink-dim:#9a9cc9;
    --danger:#ff4d4d;
    --ok:#57e08a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#05061a;
    overflow:hidden;
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* 전자칠판/멀티터치 환경 보정: 드래그·롱프레스 메뉴·확대 제스처 차단 (게임 디자인과 무관한 전역 보정) */
  *{ -webkit-tap-highlight-color:transparent; }
  img, svg{ -webkit-user-drag:none; -webkit-touch-callout:none; }
  .display{font-family:'Jua','Apple SD Gothic Neo',sans-serif;}

  #viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2f7a 0%, #05061a 60%);
  }
  #stage{
    position:relative;
    width:100vw; height:56.25vw; /* 16:9 */
    max-height:100vh; max-width:177.78vh;
    background:linear-gradient(180deg,var(--bg-deep),#0b0c2c);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 0 0 2px rgba(244,201,76,.25), 0 40px 80px rgba(0,0,0,.6);
  }

  /* ---------- top overlay bar: 좌20% 홈/옵션, 가운데60% 상태, 우20% 전체화면 ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:8px 10px;
    z-index:150;
    pointer-events:none;
  }
  #topbar .zone{display:flex; align-items:center; pointer-events:none;}
  #topbar .zone.left{width:20%; justify-content:flex-start;}
  #topbar .zone.center{flex:1; justify-content:center; gap:14px;}
  #topbar .zone.right{width:20%; justify-content:flex-end;}
  #topbar .pill{
    pointer-events:auto;
    background:rgba(5,6,26,.55);
    border:1px solid rgba(244,201,76,.35);
    backdrop-filter:blur(4px);
    border-radius:999px;
    padding:6px 16px;
    display:flex; align-items:center; gap:8px;
    color:var(--ink);
  }
  #crownmark{font-size:1.1em; filter:drop-shadow(0 0 6px rgba(244,201,76,.6));}
  #roundLabel{font-size:.95em; color:var(--gold-soft); letter-spacing:.02em;}
  #timerPill{font-family:'Jua'; font-size:1.5em; min-width:2.4em; text-align:center; color:var(--ink);}
  #timerPill.warn{color:var(--danger); animation:pulse .5s infinite alternate;}
  @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.12);}}

  .iconbtn{
    pointer-events:auto;
    background:rgba(5,6,26,.55);
    border:1px solid rgba(244,201,76,.35);
    backdrop-filter:blur(4px);
    border-radius:999px;
    width:clamp(32px,4.2vw,44px); height:clamp(32px,4.2vw,44px);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); font-size:clamp(15px,2vw,19px);
    cursor:pointer;
    margin-top:clamp(38px,5vw,54px); /* 우측 언어 선택 버튼과 겹치지 않도록 상단에서 아래로 내림 */
  }
  .iconbtn:active{transform:scale(.9);}

  /* ---------- main 3-column layout ---------- */
  #mainrow{position:absolute; inset:0; display:flex;}
  .panel{
    width:50%; height:100%;
    display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
  }
  .panel.right{border-left:1px solid rgba(244,201,76,.15);}
  .panel.left{border-right:1px solid rgba(244,201,76,.15);}

  .teamzone{
    flex:0 0 auto;
    display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:8px 18px; position:relative;
    padding:8px 14px;
    border-bottom:1px dashed rgba(244,201,76,.18);
  }
  .teamzone .teamname{
    font-family:'Jua'; font-size:clamp(14px,2.1vw,22px);
    color:var(--ink);
    display:flex; align-items:center; gap:6px;
    max-width:100%;
  }
  .teamzone.A .teamname{color:var(--teamA);}
  .teamzone.B .teamname{color:var(--teamB);}
  .teamzone .score{
    font-family:'Jua'; font-size:clamp(26px,4.2vw,44px);
    color:var(--ink);
    line-height:1;
  }
  .crownrow{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; max-width:90%;}
  .crownrow span{font-size:clamp(11px,1.5vw,16px); opacity:.28;}
  .crownrow span.won{opacity:1; filter:drop-shadow(0 0 4px rgba(244,201,76,.8));}

  .penalty{
    position:absolute; inset:0;
    background:rgba(5,6,26,.72);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column; gap:2px;
    color:var(--danger);
    font-family:'Jua';
    z-index:5;
  }
  .penalty.show{display:flex;}
  .penalty .big{font-size:clamp(24px,3.6vw,34px);}
  .penalty .small{font-family:'Gowun Dodum'; font-size:clamp(10px,1.4vw,13px); color:var(--ink-dim);}

  /* ---------- 보기(정답 버튼) 영역: 납작하게 ---------- */
  .answers{
    flex:0 0 16%;
    display:grid; grid-template-rows:repeat(2,1fr);
    gap:4px; padding:6px 8px;
  }
  .ansbtn{
    border:none; border-radius:8px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    color:var(--ink);
    font-family:'Gowun Dodum';
    font-size:clamp(8px,1vw,12px);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2px 3px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
    line-height:1.15;
  }
  .panel.left .ansbtn:active{transform:scale(.94); background:var(--teamA-dim);}
  .panel.right .ansbtn:active{transform:scale(.94); background:var(--teamB-dim);}
  .ansbtn.correct{background:var(--ok); color:#08300f; font-weight:bold; border-color:var(--ok);}
  .ansbtn.wrong{background:var(--danger); color:#3a0505; animation:shake .3s;}
  .ansbtn:disabled{opacity:.35; cursor:default;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* ---------- per-team wide photo area: 아래쪽으로 내려서 배치 ---------- */
  .photowrap{
    flex:1 1 auto;
    width:100%;
    display:flex; align-items:flex-end; justify-content:center;
    padding:6px 16px 10px;
  }
  .stagebox{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    max-height:100%;
    border-radius:12px;
    overflow:hidden;
    touch-action:none;
    background:#0c0e2c;
    box-shadow:0 0 0 3px rgba(255,255,255,.08), 0 10px 26px rgba(0,0,0,.45);
  }
  .photowrap.A .stagebox{box-shadow:0 0 0 3px rgba(255,107,92,.55), 0 10px 26px rgba(0,0,0,.45);}
  .photowrap.B .stagebox{box-shadow:0 0 0 3px rgba(63,193,233,.55), 0 10px 26px rgba(0,0,0,.45);}
  .photo-layer{position:absolute; inset:0; width:100%; height:100%; background:#0c0e2c;}
  .photo-layer img{width:100%; height:100%; object-fit:contain; display:block; pointer-events:none;}
  .mask-canvas{position:absolute; inset:0; width:100%; height:100%;}
  .revealed-tag{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    background:rgba(5,6,26,.7); color:var(--gold-soft); font-family:'Jua';
    font-size:clamp(11px,1.6vw,16px); padding:3px 12px; border-radius:999px;
    opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .revealed-tag.show{opacity:1;}
  .title-tag{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    max-width:92%;
    background:rgba(5,6,26,.78); color:var(--gold); font-family:'Jua';
    font-size:clamp(14px,2.8vw,30px); padding:6px 18px; border-radius:12px;
    opacity:0; transition:opacity .3s; pointer-events:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    box-shadow:0 4px 16px rgba(0,0,0,.45);
    z-index:6;
  }
  .title-tag.show{opacity:1;}
  .winglow{position:absolute; inset:-3px; border-radius:14px; opacity:0; pointer-events:none;
    transition:opacity .3s; box-shadow:0 0 0 4px var(--ok), 0 0 30px 6px var(--ok);}
  .winglow.show{opacity:1;}

  /* ---------- 문제당 제한시간 표시 막대 (사진 박스 하단) ---------- */
  .timebar-track{
    position:absolute; left:0; right:0; bottom:0; height:7px;
    background:rgba(0,0,0,.4);
    z-index:4; pointer-events:none;
    opacity:1; transition:opacity .25s ease;
  }
  .timebar-track.hide{opacity:0;}
  .timebar-fill{
    height:100%; width:100%;
    background:linear-gradient(90deg,var(--ok),var(--gold-soft));
    transition:width .1s linear, background .2s ease;
  }
  .timebar-fill.warn{
    background:linear-gradient(90deg,var(--danger),#ff8a65);
    animation:timebarwarn .5s infinite alternate;
  }
  @keyframes timebarwarn{from{opacity:1;}to{opacity:.55;}}

  /* ---------- setup overlay ---------- */
  #setup{
    position:absolute; inset:0; z-index:100;
    background:radial-gradient(ellipse at 50% 0%,#2a2f7a 0%,#0b0c2c 65%);
    display:flex; align-items:center; justify-content:center;
    padding:14px;
  }
  #setupInner{
    width:100%; max-height:100%;
    overflow-y:auto; touch-action:pan-y;
    display:flex; flex-direction:column; align-items:center;
    gap:12px; padding:8px 6px 20px; text-align:center;
  }
  #setup h1{
    font-family:'Jua'; color:var(--gold); font-size:clamp(24px,4.6vw,46px);
    margin:0; letter-spacing:.02em;
    text-shadow:0 0 26px rgba(244,201,76,.45);
  }
  #setup .sub{color:var(--ink-dim); font-size:clamp(11px,1.5vw,15px); margin-top:-6px;}
  #setup .sectitle{color:var(--gold-soft); font-family:'Jua'; font-size:clamp(12px,1.6vw,16px); margin-bottom:2px;}
  .nameinputs{display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center;}
  .nameinputs input{
    font-family:'Jua'; font-size:clamp(14px,2vw,20px);
    text-align:center; padding:7px 12px; border-radius:10px; border:2px solid;
    background:rgba(255,255,255,.06); color:var(--ink); width:clamp(100px,16vw,200px);
  }
  .nameinputs input.A{border-color:var(--teamA); color:var(--teamA);}
  .nameinputs input.B{border-color:var(--teamB); color:var(--teamB);}
  .vsmark{font-family:'Jua'; color:var(--gold); font-size:clamp(16px,2.4vw,24px);}

  .chipgroup{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:min(900px,92vw);}
  .chipgroup button{
    font-family:'Jua'; font-size:clamp(11px,1.5vw,15px);
    color:var(--ink); background:rgba(255,255,255,.06);
    border:2px solid rgba(244,201,76,.4); border-radius:12px;
    padding:7px 13px; cursor:pointer;
    display:flex; align-items:center; gap:5px;
  }
  .chipgroup button.sel{background:var(--gold); color:#3a2b03; border-color:var(--gold);}
  .chipgroup button.wide{font-size:clamp(11px,1.6vw,15px);}

  #startbtn{
    font-family:'Jua'; font-size:clamp(16px,2.4vw,24px);
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    color:#3a2b03; border:none; border-radius:14px; padding:12px 36px;
    cursor:pointer; margin-top:4px;
    box-shadow:0 8px 0 #a3781f, 0 14px 24px rgba(0,0,0,.4);
  }
  #startbtn:active{transform:translateY(6px); box-shadow:0 2px 0 #a3781f;}

  /* ---------- round / match end overlay ---------- */
  #banner{
    position:absolute; inset:0; z-index:90;
    display:none; align-items:center; justify-content:center;
    background:rgba(5,6,26,.55);
  }
  #banner.show{display:flex;}
  #banner .box{
    background:linear-gradient(180deg,var(--bg-panel),var(--bg-panel-2));
    border:2px solid var(--gold);
    border-radius:18px; padding:26px 40px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  #banner .headline{font-family:'Jua'; font-size:clamp(26px,4.4vw,42px); color:var(--gold); margin-bottom:6px;}
  #banner .detail{color:var(--ink-dim); font-size:clamp(12px,1.8vw,16px); margin-bottom:14px;}
  #banner button{
    font-family:'Jua'; font-size:clamp(14px,2vw,18px);
    background:var(--gold); color:#3a2b03; border:none; border-radius:10px;
    padding:10px 24px; cursor:pointer;
  }
  #banner .autonext{color:var(--ink-dim); font-size:clamp(10px,1.4vw,13px); margin-top:10px; min-height:1.2em;}

  /* ---------- 시작 전 3·2·1 카운트다운 ---------- */
  #countdown{
    position:absolute; inset:0; z-index:95;
    display:none; align-items:center; justify-content:center;
    background:rgba(5,6,26,.62);
    pointer-events:none;
  }
  #countdown.show{display:flex;}
  .cd-number{
    font-family:'Jua'; color:var(--gold);
    font-size:clamp(60px,16vw,180px);
    text-shadow:0 0 40px rgba(244,201,76,.65), 0 8px 0 rgba(0,0,0,.35);
    opacity:0;
  }
  .cd-number.pop{animation:cdpop .7s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes cdpop{
    0%{opacity:0; transform:scale(.4);}
    35%{opacity:1; transform:scale(1.15);}
    60%{transform:scale(1);}
    100%{opacity:0; transform:scale(1);}
  }
</style>

<!-- ==========================================================================
     언어 선택 UI 전용 스타일시트 (게임 CSS와 완전히 분리, 클래스는 전부 lm- 접두사)
     - 게임 쪽 스타일과 절대 공유되는 선택자가 없도록 독립 운영합니다.
     - 폰트어썸 아이콘(<i class="fa-...">)에는 sans-serif를 강제하지 않습니다 (깨짐 방지).
     ========================================================================== -->
<style id="lmStyles">
  #lmTrigger, #lmTrigger *,
  #lmModal, #lmModal *,
  #lmToast, #lmToast *{
    box-sizing:border-box !important;
  }

  #lmTrigger{
    position:fixed; top:12px; right:12px; z-index:99999;
    display:flex; align-items:center; gap:8px;
    background:rgba(17,20,34,.82);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;
    padding:8px 14px;
    color:#e9ebf5;
    font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans','Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    cursor:pointer;
    backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:background .15s ease, transform .1s ease;
  }
  #lmTrigger:hover{background:rgba(30,34,54,.92);}
  #lmTrigger:active{transform:scale(.96);}
  #lmTrigger .lm-globe{color:#9aa0c0; font-size:14px;}
  #lmTrigger .lm-flag{width:20px; height:14px; object-fit:cover; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.15); flex:0 0 auto;}
  #lmTrigger .lm-curname{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #lmTrigger .lm-chev{color:#9aa0c0; font-size:10px;}
  #lmTrigger.lm-hidden{display:none !important;}

  #lmModal{
    position:fixed; inset:0; z-index:99999;
    display:flex; align-items:flex-start; justify-content:center;
    padding:64px 16px 16px;
    background:rgba(4,5,12,.68);
    backdrop-filter:blur(3px);
    opacity:0; visibility:hidden;
    transition:opacity .2s ease, visibility .2s ease;
    font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans','Helvetica Neue',Arial,sans-serif;
  }
  #lmModal.lm-active{opacity:1; visibility:visible;}
  @media (min-width:640px){ #lmModal{ align-items:center; padding:16px; } }

  #lmModal .lm-content{
    width:100%; max-width:760px; max-height:82vh;
    display:flex; flex-direction:column;
    background:#12141f;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    transform:scale(.96) translateY(-8px);
    transition:transform .2s ease;
  }
  #lmModal.lm-active .lm-content{transform:scale(1) translateY(0);}

  #lmModal .lm-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.08);
    background:#12141f;
  }
  #lmModal .lm-title{margin:0; font-size:17px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px;}
  #lmModal .lm-title i{color:#f4c94c;}
  #lmModal .lm-closebtn{
    width:34px; height:34px; border-radius:999px; border:none;
    background:rgba(255,255,255,.08); color:#c7cad8;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:14px;
  }
  #lmModal .lm-closebtn:hover{background:rgba(255,255,255,.16); color:#fff;}

  #lmModal .lm-searchwrap{position:relative; padding:14px 18px 6px;}
  #lmModal .lm-searchicon{position:absolute; left:32px; top:50%; transform:translateY(-50%); color:#7d8199; font-size:13px;}
  #lmModal .lm-searchinput{
    width:100%; padding:11px 14px 11px 36px;
    background:#1b1e2c; border:1px solid rgba(255,255,255,.14); border-radius:12px;
    color:#fff; font-size:13px; outline:none;
  }
  #lmModal .lm-searchinput:focus{border-color:#f4c94c; box-shadow:0 0 0 2px rgba(244,201,76,.25);}
  #lmModal .lm-searchinput::placeholder{color:#6b6f88;}

  #lmModal .lm-body{padding:14px 18px 18px; overflow-y:auto; flex:1;}
  #lmModal .lm-body::-webkit-scrollbar{width:8px;}
  #lmModal .lm-body::-webkit-scrollbar-track{background:rgba(255,255,255,.04); border-radius:4px;}
  #lmModal .lm-body::-webkit-scrollbar-thumb{background:#3a3e54; border-radius:4px;}
  #lmModal .lm-body::-webkit-scrollbar-thumb:hover{background:#4c5170;}

  #lmModal .lm-grid{display:grid; grid-template-columns:repeat(1,1fr); gap:8px;}
  @media (min-width:520px){ #lmModal .lm-grid{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:860px){ #lmModal .lm-grid{grid-template-columns:repeat(3,1fr);} }

  #lmModal .lm-card{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:12px;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03);
    cursor:pointer; transition:background .15s ease, border-color .15s ease;
  }
  #lmModal .lm-card:hover{background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.22);}
  #lmModal .lm-card.lm-selected{background:rgba(244,201,76,.1); border-color:#f4c94c;}

  /* =========================================================================

     ========================================================================= */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ try{ audioCtx = new AC(); }catch(e){} }
    }
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(function(){}); }
    return audioCtx;
  }
  function playTone(freq, startOffset, duration, opts){
    const ctx = ensureAudio();
    if(!ctx) return;
    opts = opts || {};
    try{
      const startAt = ctx.currentTime + (startOffset || 0);
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, startAt);
      if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(opts.slideTo, startAt + duration);
      const peak = opts.gain != null ? opts.gain : 0.18;
      gainNode.gain.setValueAtTime(0.0001, startAt);
      gainNode.gain.linearRampToValueAtTime(peak, startAt + 0.012);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      osc.connect(gainNode).connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + duration + 0.03);
    }catch(e){}
  }

  const spot = {A: makeSpotlight(), B: makeSpotlight()};

  function applyDifficulty(sp){
    const p = DIFFICULTY_PRESETS[state.difficulty] || DIFFICULTY_PRESETS.normal;
    sp.minR = p.minR; sp.maxR = p.maxR;
  }

  function resizeCanvas(canvasEl, sp){
    const rect = canvasEl.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvasEl.width = rect.width * dpr;
    canvasEl.height = rect.height * dpr;
    canvasEl.style.width = rect.width + 'px';
    canvasEl.style.height = rect.height + 'px';
    sp.w = rect.width; sp.h = rect.height;
    sp.cx = sp.tx = rect.width/2; sp.cy = sp.ty = rect.height/2;
  }

  function setupStagePointer(stageEl, sp, teamKey){
    let activeId = null;
    function isLive(){
      return state.mode === 'match' ? state.roundActive : (state.matchActive && !teamState[teamKey].decided);
    }
    function updateTarget(e){
      const rect = stageEl.getBoundingClientRect();
      sp.tx = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      sp.ty = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    }
    stageEl.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      if(!isLive()) return;
      activeId = e.pointerId;
      try{ stageEl.setPointerCapture(e.pointerId); }catch(err){}
      updateTarget(e);
    }, {passive:false});
    stageEl.addEventListener('pointermove', (e)=>{
      if(!isLive()) return;
      if(e.pointerId !== activeId) return;
      e.preventDefault();
      updateTarget(e);
    }, {passive:false});
    stageEl.addEventListener('pointerup', (e)=>{
      if(e.pointerId === activeId) activeId = null;
    });
    stageEl.addEventListener('pointercancel', (e)=>{
      if(e.pointerId === activeId) activeId = null;
    });
  }
  setupStagePointer(els.stageA, spot.A, 'A');
  setupStagePointer(els.stageB, spot.B, 'B');

  function drawMask(canvasEl, sp, elapsedFrac){
    const ctx = canvasEl.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = sp.w, h = sp.h;
    if(w<=0||h<=0) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#05061a';
    ctx.fillRect(0,0,w,h);

    const speed = sp.minSpeed + (sp.maxSpeed - sp.minSpeed) * elapsedFrac;
    sp.cx += (sp.tx - sp.cx) * speed;
    sp.cy += (sp.ty - sp.cy) * speed;

    const rFrac = sp.minR + (sp.maxR - sp.minR) * elapsedFrac;
    const r = rFrac * Math.min(w,h);

    ctx.globalCompositeOperation = 'destination-out';
    const grad = ctx.createRadialGradient(sp.cx, sp.cy, r*0.55, sp.cx, sp.cy, r);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sp.cx, sp.cy, r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function clearMask(canvasEl, sp){
    const ctx = canvasEl.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,sp.w,sp.h);
  }

  /* ---------- 문제 출제 helpers ---------- */
  function pickCategoryKey(){
    const keys = selectedCategories.size ? [...selectedCategories] : CATEGORY_KEYS;
    return keys[Math.floor(Math.random()*keys.length)];
  }

  // 카테고리별 "안 나온 문제부터" 큐. 다 쓰면 다시 섞어서 채우므로
  // 이미 나온 문제는 그 카테고리의 나머지 문제를 다 쓸 때까지 최대한 뒤로 밀립니다.
  const categoryQueues = {};
  function shuffleArray(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function resetQueues(){
    Object.keys(categoryQueues).forEach(function(k){ delete categoryQueues[k]; });
  }
  function pickNextItem(catKey){
    let queue = categoryQueues[catKey];
    if(!queue || queue.length === 0){
      queue = shuffleArray(CATEGORY_DEFS[catKey].items);
      categoryQueues[catKey] = queue;
    }
    const it = queue.shift();
    return {file:it.file, name:it.name, dir:CATEGORY_DEFS[catKey].dir, categoryKey:catKey};
  }
  function setPhoto(team, item){
    const layer = team==='A' ? els.photoA : els.photoB;
    layer.innerHTML = '';
    const img = document.createElement('img');
    img.src = item.dir + '/' + item.file;
    img.alt = '';
    img.draggable = false;
    layer.appendChild(img);
  }
  function buildOptions(catKey, correctName){
    const items = CATEGORY_DEFS[catKey].items;
    const names = items.map(function(i){ return i.name; });
    const pool = names.filter(function(n){ return n !== correctName; });
    const shuffled = pool.sort(()=>Math.random()-0.5);
    const count = Math.min(14, pool.length + 1);
    const chosen = shuffled.slice(0, Math.max(0, count-1));
    return [...chosen, correctName].sort(()=>Math.random()-0.5);
  }
  function renderAnswers(container, options, team){
    container.innerHTML = '';
    container.style.gridTemplateColumns = 'repeat(' + Math.max(1, Math.ceil(options.length/2)) + ', 1fr)';
    options.forEach(function(name){
      const btn = document.createElement('button');
      btn.className = 'ansbtn';
      btn.textContent = name;
      btn.addEventListener('pointerdown', ()=> onAnswer(team, name, btn));
      container.appendChild(btn);
    });
  }
  function setAnswersDisabled(team, disabled){
    const container = team==='A'? els.answersA: els.answersB;
    [...container.children].forEach(b=> b.disabled = disabled);
  }
  function revealFull(team, tagText){
    const sp = team==='A'? spot.A: spot.B;
    const canvas = team==='A'? els.maskA: els.maskB;
    clearMask(canvas, sp);
    const tagEl = team==='A'? els.tagA: els.tagB;
    tagEl.textContent = tagText || T.tagCorrect;
    tagEl.classList.add('show');
    const titleEl = team==='A'? els.titleA: els.titleB;
    titleEl.textContent = teamState[team].answerName || '';
    titleEl.classList.add('show');
    hideTimebar(team);
  }

  /* ---------- 문제당 제한시간 막대 ---------- */
  function resetTimebar(team){
    const wrap = team==='A'? els.timebarWrapA: els.timebarWrapB;
    const fill = team==='A'? els.timebarA: els.timebarB;
    wrap.classList.remove('hide');
    fill.classList.remove('warn');
    fill.style.width = '100%';
  }
  function hideTimebar(team){
    (team==='A'? els.timebarWrapA: els.timebarWrapB).classList.add('hide');
  }
  function setTimebarProgress(team, remainFrac){
    const fill = team==='A'? els.timebarA: els.timebarB;
    const pct = Math.max(0, Math.min(1, remainFrac)) * 100;
    fill.style.width = pct + '%';
    fill.classList.toggle('warn', remainFrac <= 0.2);
  }

  /* ---------- 답변 처리 ---------- */
  function onAnswer(team, picked, btnEl){
    const now = performance.now();
    const tm = teamState[team];
    if(state.mode === 'match'){
      if(!state.roundActive || tm.decided) return;
      if(now < tm.penaltyUntil) return;
      if(picked === tm.answerName){
        btnEl.classList.add('correct');
        tm.decided = true;
        revealFull(team, T.tagCorrect);
        sfx.correct();
        state.score[team] += 1;
        updateScores();
        const sid = state.sessionId;
        setTimeout(()=>{ if(sid !== state.sessionId) return; finishRound(team); }, 2000);
      } else {
        wrongFlow(team, btnEl, now);
      }
    } else {
      if(!state.matchActive || tm.decided || tm.resolving) return;
      if(now < tm.penaltyUntil) return;
      if(picked === tm.answerName){
        btnEl.classList.add('correct');
        tm.decided = true; tm.resolving = true;
        revealFull(team, T.tagCorrect);
        sfx.correct();
        state.score[team] += 1;
        updateScores();
        setAnswersDisabled(team, true);
        const sid = state.sessionId;
        setTimeout(()=>{ if(sid !== state.sessionId || !state.matchActive) return; startTeamItem(team); }, 2000);
      } else {
        wrongFlow(team, btnEl, now);
      }
    }
  }
  function wrongFlow(team, btnEl, now){
    btnEl.classList.add('wrong');
    sfx.wrong();
    setTimeout(()=> btnEl.classList.remove('wrong'), 300);
    teamState[team].penaltyUntil = now + state.penaltyDuration;
    setAnswersDisabled(team, true);
  }

  /* ---------- 라운드 배너 자동 진행 (3초 타이머) ---------- */
  let bannerAutoTimer = null;
  let bannerAutoInterval = null;
  function clearBannerAuto(){
    if(bannerAutoTimer){ clearTimeout(bannerAutoTimer); bannerAutoTimer = null; }
    if(bannerAutoInterval){ clearInterval(bannerAutoInterval); bannerAutoInterval = null; }
    els.bannerAuto.textContent = '';
  }
  function armBannerAuto(seconds, action){
    clearBannerAuto();
    const sid = state.sessionId;
    let remain = seconds;
    els.bannerAuto.textContent = T.autoNext(remain);
    bannerAutoInterval = setInterval(()=>{
      remain -= 1;
      if(remain <= 0) return;
      els.bannerAuto.textContent = T.autoNext(remain);
    }, 1000);
    bannerAutoTimer = setTimeout(()=>{
      clearBannerAuto();
      if(sid !== state.sessionId) return;
      action();
    }, seconds*1000);
  }

  /* ---------- 라운드 대결(선승제) 모드 ---------- */
  function startRoundMatch(){
    const catKey = pickCategoryKey();
    const item = pickNextItem(catKey);

    teamState.A = {answerName:item.name, decided:false, penaltyUntil:0, roundStart:0, itemDuration:0, resolving:false};
    teamState.B = {answerName:item.name, decided:false, penaltyUntil:0, roundStart:0, itemDuration:0, resolving:false};

    setPhoto('A', item);
    setPhoto('B', item);
    els.tagA.classList.remove('show');
    els.tagB.classList.remove('show');
    els.titleA.classList.remove('show');
    els.titleB.classList.remove('show');
    els.glowA.classList.remove('show');
    els.glowB.classList.remove('show');

    const options = buildOptions(catKey, item.name);
    renderAnswers(els.answersA, options, 'A');
    renderAnswers(els.answersB, options, 'B');
    setAnswersDisabled('A', false);
    setAnswersDisabled('B', false);

    applyDifficulty(spot.A); applyDifficulty(spot.B);
    resizeCanvas(els.maskA, spot.A);
    resizeCanvas(els.maskB, spot.B);

    els.roundLabel.textContent = T.roundLabel(state.roundNum, state.format);

    state.roundStart = performance.now();
    state.roundDuration = 30;
    state.roundActive = true;
    lastWarnSecs = null;
    clearBannerAuto();
    els.banner.classList.remove('show');
    resetTimebar('A');
    resetTimebar('B');
  }

  function endRoundTimeout(){
    state.roundActive = false;
    revealFull('A', T.tagTimeUp); revealFull('B', T.tagTimeUp);
    els.bannerHead.textContent = T.timeUpHead;
    els.bannerDetail.textContent = T.timeUpDetail(teamState.A.answerName);
    els.bannerBtn.textContent = T.nextBtn;
    els.banner.classList.add('show');
    els.bannerBtn.onpointerdown = ()=>{ clearBannerAuto(); nextRoundOrEnd(); };
    armBannerAuto(3, nextRoundOrEnd);
  }

  function finishRound(winnerTeam){
    if(!state.roundActive) return;
    state.roundActive = false;
    revealFull(winnerTeam, T.tagCorrect);
    const loser = winnerTeam==='A' ? 'B' : 'A';
    revealFull(loser, T.tagRevealed);
    (winnerTeam==='A'? els.glowA: els.glowB).classList.add('show');

    if(state.score[winnerTeam] >= state.format){
      els.bannerHead.textContent = T.champion(state.teamName[winnerTeam]);
      els.bannerDetail.textContent = T.finalScore(state.score.A, state.score.B);
      els.bannerBtn.textContent = T.restartBtn;
      els.banner.classList.add('show');
      els.bannerBtn.onpointerdown = ()=>{ clearBannerAuto(); els.banner.classList.remove('show'); els.setup.style.display='flex'; showLangTrigger(); };
    } else {
      els.bannerHead.textContent = T.roundWin(state.teamName[winnerTeam]);
      els.bannerDetail.textContent = T.answerWas(teamState[winnerTeam].answerName);
      els.bannerBtn.textContent = T.nextBtn;
      els.banner.classList.add('show');
      els.bannerBtn.onpointerdown = ()=>{ clearBannerAuto(); nextRoundOrEnd(); };
      armBannerAuto(3, nextRoundOrEnd);
    }
  }

  function nextRoundOrEnd(){
    state.roundNum += 1;
    startRoundMatch();
  }

  /* ---------- 타임어택(60초) 모드 ---------- */
  function startTimeAttack(){
    state.matchActive = true;
    state.matchEnd = performance.now() + 60000;
    lastWarnSecs = null;
    els.roundLabel.textContent = T.taLabel;
    startTeamItem('A');
    startTeamItem('B');
  }

  function startTeamItem(team){
    const catKey = pickCategoryKey();
    const item = pickNextItem(catKey);
    const tm = teamState[team];
    tm.answerName = item.name;
    tm.decided = false;
    tm.resolving = false;
    tm.penaltyUntil = 0;
    tm.itemDuration = 14;
    tm.roundStart = performance.now();

    setPhoto(team, item);
    const tagEl = team==='A'? els.tagA: els.tagB;
    const titleEl = team==='A'? els.titleA: els.titleB;
    const glowEl = team==='A'? els.glowA: els.glowB;
    tagEl.classList.remove('show');
    titleEl.classList.remove('show');
    glowEl.classList.remove('show');
    resetTimebar(team);

    const container = team==='A'? els.answersA: els.answersB;
    renderAnswers(container, buildOptions(catKey, item.name), team);
    setAnswersDisabled(team, false);

    const sp = team==='A'? spot.A: spot.B;
    const canvas = team==='A'? els.maskA: els.maskB;
    applyDifficulty(sp);
    resizeCanvas(canvas, sp);
  }

  function finishTimeAttack(){
    state.matchActive = false;
    revealFull('A', T.tagFinished); revealFull('B', T.tagFinished);
    setAnswersDisabled('A', true);
    setAnswersDisabled('B', true);
    let head;
    if(state.score.A === state.score.B){ head = T.drawHead; }
    else{ const w = state.score.A > state.score.B ? 'A' : 'B'; head = T.winHead(state.teamName[w]); }
    els.bannerHead.textContent = head;
    els.bannerDetail.textContent = state.teamName.A + ' ' + state.score.A + ' : ' + state.score.B + ' ' + state.teamName.B;
    els.bannerBtn.textContent = T.restartBtn;
    els.banner.classList.add('show');
    els.bannerBtn.onpointerdown = ()=>{ clearBannerAuto(); els.banner.classList.remove('show'); els.setup.style.display='flex'; showLangTrigger(); };
  }

  /* ---------- main loop ---------- */
  let rafId = null;
  function loop(){
    rafId = requestAnimationFrame(loop);
    const now = performance.now();

    if(state.mode === 'match'){
      let frac = 0;
      if(state.roundActive) frac = Math.min(1, (now - state.roundStart) / (state.roundDuration*1000));
      if(!teamState.A.decided){ drawMask(els.maskA, spot.A, frac); setTimebarProgress('A', 1 - frac); }
      if(!teamState.B.decided){ drawMask(els.maskB, spot.B, frac); setTimebarProgress('B', 1 - frac); }
      if(state.roundActive){
        const remain = Math.max(0, state.roundDuration - (now - state.roundStart)/1000);
        const secs = Math.ceil(remain);
        els.timerPill.textContent = secs;
        els.timerPill.classList.toggle('warn', secs <= 5);
        if(secs <= 5 && secs >= 1 && secs !== lastWarnSecs){ sfx.warn(); lastWarnSecs = secs; }
        if(remain <= 0){ endRoundTimeout(); }
      }
    } else {
      if(state.matchActive){
        const remain = Math.max(0, (state.matchEnd - now)/1000);
        const secs = Math.ceil(remain);
        els.timerPill.textContent = secs;
        els.timerPill.classList.toggle('warn', secs <= 10);
        if(secs <= 5 && secs >= 1 && secs !== lastWarnSecs){ sfx.warn(); lastWarnSecs = secs; }
        if(remain <= 0){ finishTimeAttack(); }
      }
      ['A','B'].forEach(function(team){
        const tm = teamState[team];
        const sp = team==='A'? spot.A: spot.B;
        const canvas = team==='A'? els.maskA: els.maskB;
        if(state.matchActive && !tm.decided){
          const frac = Math.min(1, (now - tm.roundStart) / (tm.itemDuration*1000));
          drawMask(canvas, sp, frac);
          setTimebarProgress(team, 1 - frac);
          if(frac >= 1 && !tm.resolving){
            tm.resolving = true;
            setAnswersDisabled(team, true);
            revealFull(team, T.tagNext);
            const sid = state.sessionId;
            setTimeout(()=>{ if(sid !== state.sessionId || !state.matchActive) return; startTeamItem(team); }, 1500);
          }
        }
      });
    }

    // penalty countdown UI (공통)
    ['A','B'].forEach(team=>{
      const tm = teamState[team];
      const until = tm.penaltyUntil;
      const pEl = team==='A'? els.penaltyA: els.penaltyB;
      const tEl = team==='A'? els.penaltyTimeA: els.penaltyTimeB;
      if(until && now < until){
        pEl.classList.add('show');
        tEl.textContent = Math.ceil((until-now)/1000);
      } else if(pEl.classList.contains('show')){
        pEl.classList.remove('show');
        if(!tm.decided) setAnswersDisabled(team, false);
      }
    });
  }

  window.addEventListener('resize', ()=>{
    if(state.mode === 'match' && state.roundActive){
      resizeCanvas(els.maskA, spot.A);
      resizeCanvas(els.maskB, spot.B);
    } else if(state.mode === 'timeattack' && state.matchActive){
      if(!teamState.A.decided) resizeCanvas(els.maskA, spot.A);
      if(!teamState.B.decided) resizeCanvas(els.maskB, spot.B);
    }
  });

  /* =========================================================================
     언어 선택 UI 로직 (게임 로직과는 완전히 별개 — 오직 화면 문구만 갱신합니다)
     ========================================================================= */
  const lmEls = {
    trigger: document.getElementById('lmTrigger'),
    flag: document.getElementById('lmCurrentFlag'),
    name: document.getElementById('lmCurrentName'),
    modal: document.getElementById('lmModal'),
    close: document.getElementById('lmClose'),
    search: document.getElementById('lmSearch'),
    grid: document.getElementById('lmGrid'),
    noResult: document.getElementById('lmNoResult'),
    toast: document.getElementById('lmToast'),
    toastMsg: document.getElementById('lmToastMsg'),
    toastLang: document.getElementById('lmToastLang')
  };

  let currentLang = 'en';
  let T = I18N.en;
  let lastDefaultA = null, lastDefaultB = null;
  let toastTimer = null;

  function showLangTrigger(){ lmEls.trigger.classList.remove('lm-hidden'); }
  function hideLangTrigger(){ lmEls.trigger.classList.add('lm-hidden'); }

  // 화면 크기에 맞춰 폭을 넘는 텍스트만 글자 크기를 줄입니다 (게임 화면 폰트에는 영향 없음)
  function autoFit(el, maxWidthPx, minPx, startPx){
    if(!el) return;
    el.style.fontSize = startPx + 'px';
    let size = startPx;
    let guard = 0;
    while(el.scrollWidth > maxWidthPx && size > minPx && guard < 30){
      size -= 1;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }
  function autoFitChipGroup(container){
    if(!container) return;
    [...container.children].forEach(function(btn){
      btn.style.fontSize = '';
      requestAnimationFrame(function(){
        if(btn.scrollWidth > btn.clientWidth + 2){
          let size = parseFloat(getComputedStyle(btn).fontSize);
          let guard = 0;
          while(btn.scrollWidth > btn.clientWidth + 2 && size > 9 && guard < 20){
            size -= 1;
            btn.style.fontSize = size + 'px';
            guard++;
          }
        }
      });
    });
  }

  function detectInitialLang(){
    try{
      const params = new URLSearchParams(location.search);
      const urlLang = params.get('lang');
      if(urlLang && LM_SUPPORTED.indexOf(urlLang.toLowerCase()) !== -1) return urlLang.toLowerCase();
    }catch(e){}
    try{
      const saved = localStorage.getItem(LM_STORAGE_KEY);
      if(saved && LM_SUPPORTED.indexOf(saved) !== -1) return saved;
    }catch(e){}
    try{
      const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if(LM_SUPPORTED.indexOf(nav) !== -1) return nav;
      const short = nav.split('-')[0];
      const match = LM_SUPPORTED.find(function(l){ return l.split('-')[0] === short; });
      if(match) return match;
    }catch(e){}
    return 'en';
  }

  function applyLanguage(code, opts){
    opts = opts || {};
    if(!I18N[code]) code = 'en';
    currentLang = code;
    T = I18N[code];

    if(code === 'ko'){
      els_appTitleMain().textContent = '포커스킹';
      const sub = els_appTitleSub();
      sub.style.display = '';
      sub.textContent = 'FOCUS KING';
    } else {
      els_appTitleMain().textContent = T.title;
      els_appTitleSub().style.display = 'none';
    }
    document.getElementById('setupSub').textContent = T.sub;

    if(lastDefaultA === null || els.inputA.value === lastDefaultA) els.inputA.value = T.teamA;
    lastDefaultA = T.teamA;
    if(lastDefaultB === null || els.inputB.value === lastDefaultB) els.inputB.value = T.teamB;
    lastDefaultB = T.teamB;

    document.getElementById('catSectionTitle').textContent = T.catTitle;
    const CAT_KEY_MAP = {frog:'catFrog', animal:'catAnimal', plant:'catPlant', art:'catArt', heritage:'catHeritage', city:'catCity', instrument:'catInstrument'};
    [...els.categoryPick.children].forEach(function(btn){
      if(btn.dataset.all){ btn.textContent = T.catAll; }
      else{
        const def = CATEGORY_DEFS[btn.dataset.key];
        btn.textContent = def.icon + ' ' + T[CAT_KEY_MAP[btn.dataset.key]];
      }
    });

    document.getElementById('modeSectionTitle').textContent = T.modeTitle;
    const modeMatchBtn = els.modePick.querySelector('[data-mode="match"]');
    const modeTABtn = els.modePick.querySelector('[data-mode="timeattack"]');
    if(modeMatchBtn) modeMatchBtn.textContent = T.modeMatch;
    if(modeTABtn) modeTABtn.textContent = T.modeTA;

    document.getElementById('fmtSectionTitle').textContent = T.fmtTitle;
    [...els.formatPick.children].forEach(function(btn, i){ if(T.win[i]) btn.textContent = T.win[i]; });

    document.getElementById('diffSectionTitle').textContent = T.diffTitle;
    const diffEasyBtn = els.diffPick.querySelector('[data-d="easy"]');
    const diffNormalBtn = els.diffPick.querySelector('[data-d="normal"]');
    const diffHardBtn = els.diffPick.querySelector('[data-d="hard"]');
    if(diffEasyBtn) diffEasyBtn.textContent = T.diffEasy;
    if(diffNormalBtn) diffNormalBtn.textContent = T.diffNormal;
    if(diffHardBtn) diffHardBtn.textContent = T.diffHard;

    els.startbtn.textContent = T.start;
    els.homebtn.title = T.homeTip;
    els.fsbtn.title = T.fsTip;
    document.querySelectorAll('.penalty .small').forEach(function(el){ el.textContent = T.penalty; });

    const langDef = LM_LANGS.find(function(l){ return l.code === code; }) || LM_LANGS[1];
    lmEls.flag.src = 'https://flagcdn.com/w40/' + langDef.country + '.png';
    lmEls.name.textContent = langDef.native;
    autoFit(lmEls.name, 120, 9, 13);

    document.getElementById('seoTitleTag').textContent = T.seoTitle;
    document.getElementById('seoDescTag').setAttribute('content', T.seoDesc);
    document.getElementById('seoKeywordsTag').setAttribute('content', T.seoKeywords);
    document.documentElement.setAttribute('lang', code);

    autoFitChipGroup(els.categoryPick);
    autoFitChipGroup(els.modePick);
    autoFitChipGroup(els.formatPick);
    autoFitChipGroup(els.diffPick);

    if(!opts.skipPersist){
      try{ localStorage.setItem(LM_STORAGE_KEY, code); }catch(e){}
    }
    if(!opts.skipHistory){
      try{
        const url = new URL(location.href);
        url.searchParams.set('lang', code);
        history.pushState({}, '', url);
      }catch(e){}
    }
    renderLanguages(lmEls.search.value);
  }
  function els_appTitleMain(){ return document.getElementById('appTitleMain'); }
  function els_appTitleSub(){ return document.getElementById('appTitleSub'); }

  // 언어 카드 목록을 그려주는 함수 (검색어로 필터링). 반드시 최초 1회 호출되어야 합니다.
  function renderLanguages(filterText){
    filterText = (filterText || '').toLowerCase();
    lmEls.grid.innerHTML = '';
    const filtered = LM_LANGS.filter(function(l){
      return l.native.toLowerCase().indexOf(filterText) !== -1 ||
             l.en.toLowerCase().indexOf(filterText) !== -1 ||
             l.code.toLowerCase().indexOf(filterText) !== -1;
    });
    if(filtered.length === 0){
      lmEls.grid.style.display = 'none';
      lmEls.noResult.classList.add('lm-show');
      return;
    }
    lmEls.grid.style.display = '';
    lmEls.noResult.classList.remove('lm-show');
    filtered.forEach(function(lang){
      const isSelected = lang.code === currentLang;
      const card = document.createElement('div');
      card.className = 'lm-card' + (isSelected ? ' lm-selected' : '');
      card.innerHTML =
        '<img class="lm-cardflag" src="https://flagcdn.com/w40/' + lang.country + '.png" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="lm-cardtext">' +
          '<span class="lm-cardname">' + lang.native + '</span>' +
          '<span class="lm-cardsub">' + lang.en + '</span>' +
        '</div>' +
        (isSelected ? '<i class="fa-solid fa-circle-check lm-check" aria-hidden="true"></i>' : '');
      card.addEventListener('pointerdown', function(){ selectLanguage(lang); });
      lmEls.grid.appendChild(card);
    });
  }

  function openModal(){
    lmEls.modal.classList.add('lm-active');
    lmEls.modal.setAttribute('aria-hidden', 'false');
    renderLanguages(lmEls.search.value);
    setTimeout(function(){ lmEls.search.focus(); }, 80);
  }
  function closeModal(){
    lmEls.modal.classList.remove('lm-active');
    lmEls.modal.setAttribute('aria-hidden', 'true');
  }
  function selectLanguage(lang){
    applyLanguage(lang.code);
    closeModal();
    showToast(lang);
  }
  function showToast(lang){
    lmEls.toastMsg.textContent = T.toastChanged;
    lmEls.toastLang.textContent = lang.en;
    lmEls.toast.classList.add('lm-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ lmEls.toast.classList.remove('lm-show'); }, 3000);
  }

  lmEls.trigger.addEventListener('pointerdown', openModal);
  lmEls.close.addEventListener('pointerdown', closeModal);
  lmEls.modal.addEventListener('pointerdown', function(e){ if(e.target === lmEls.modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lmEls.modal.classList.contains('lm-active')) closeModal();
  });
  lmEls.search.addEventListener('input', function(e){ renderLanguages(e.target.value); });

  window.addEventListener('popstate', function(){
    const params = new URLSearchParams(location.search);
    const urlLang = params.get('lang');
    if(urlLang && LM_SUPPORTED.indexOf(urlLang.toLowerCase()) !== -1){
      applyLanguage(urlLang.toLowerCase(), {skipHistory:true});
    }
  });

  applyLanguage(detectInitialLang(), {skipHistory:true});
  renderLanguages();
  showLangTrigger();

  /* =========================================================================
     전자칠판/멀티터치 하드닝: 확대(핀치·더블탭·Ctrl+휠) 및 우클릭·롱프레스 메뉴 차단
     ========================================================================= */
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('wheel', function(e){ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', function(e){ if(e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});

  loop();
})();
</script>
</body>
</html>
